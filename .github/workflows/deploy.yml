name: Deploy

# Staging on every pull request, Production on merge to main. Both go through
# GitHub Environments, which is what makes the OIDC trust work: naming an
# environment sets the token's subject claim to
# repo:OWNER/REPO:environment:NAME, and each environment's deployment role
# (infra/github-oidc-role.yaml) trusts exactly that string.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI (lint, typecheck, coverage, e2e) runs in parallel on the same events.
# Production is additionally protected by requiring those checks before a merge
# to main is allowed -- turn that on in branch protection. Staging deploys
# optimistically so a PR can be previewed while its checks are still running.
permissions:
  contents: read
  id-token: write

concurrency:
  # One deploy at a time per environment. Not cancel-in-progress: interrupting
  # `sam deploy` leaves a stack in UPDATE_IN_PROGRESS that the next run cannot
  # touch, so queueing is the cheaper failure mode.
  group: deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Forks never receive environment secrets, so the role assumption would
    # fail with a confusing error. Skip them explicitly instead.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'Production' || 'Staging' }}
      url: ${{ steps.deploy.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            api/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOYMENT_ROLE_ARN }}
          role-session-name: promptatron-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy
        id: deploy
        env:
          # Each environment is its own CloudFormation stack. Override per
          # environment with a STACK_NAME variable if these defaults don't suit.
          STACK_NAME: ${{ vars.STACK_NAME || (github.event_name == 'push' && 'promptatron-config' || 'promptatron-staging') }}
          DEPLOY_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          make deploy STACK_NAME="$STACK_NAME" DEPLOY_REGION="$DEPLOY_REGION" | tee deploy.log
          APP_URL=$(awk '/^Deployed: /{print $2}' deploy.log | tail -1)
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to ${{ github.event_name == 'push' && 'Production' || 'Staging' }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Stack | \`$STACK_NAME\` |"
            echo "| Region | \`$DEPLOY_REGION\` |"
            echo "| URL | $APP_URL |"
          } >> "$GITHUB_STEP_SUMMARY"
